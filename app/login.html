<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Ma Baker and Chef - Inicio de Sesión</title>
<!-- Google Fonts: Montserrat -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS v3 -->
<link rel="stylesheet" href="styles/tailwind.build.css">
<!-- Lucide Icons (via CDN for visual elements) -->
<script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.min.js" integrity="sha384-tTkFttkBclaU1cloKwOi9xk3pbao3VZxTjLNBt8iFABWDBQibbAbWpVmO28zMuxq" crossorigin="anonymous"></script>
<script>
    window.tailwind = window.tailwind || {};
    window.tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Montserrat', 'sans-serif'],
          },
          colors: {
            'mb-red': '#D7282F',
            'mb-blue': '#0071BC',
          }
        }
      }
    }
  </script>
<style data-purpose="layout-styles">
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      /* Vibrant Red Gradient Background */
      background: radial-gradient(circle at top left, #D7282F 0%, #8b1a1e 100%);
      overflow-x: hidden;
    }

    /* Glassmorphism Effect */
    .glass-card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      border-radius: 24px;
    }

    /* Custom Transitions */
    .role-btn {
      transition: all 0.3s ease;
    }
    .role-btn:hover {
      transform: translateY(-2px);
      background-color: rgba(255, 255, 255, 0.25);
    }
  </style>
<script src="js/theme.js"></script>
    <script src="js/help-overlay.js"></script>
<script src="js/uppercase.js"></script>
</head>
<body>
<!-- BEGIN: LoginContainer -->
<main class="w-full max-w-4xl p-6 md:p-12 flex justify-center items-center" data-purpose="main-login-wrapper">
<!-- BEGIN: GlassmorphismCard -->
<div class="glass-card w-full max-w-lg overflow-hidden p-8 md:p-10 text-white" data-purpose="login-card">
<!-- BEGIN: HeaderSection -->
<header class="flex flex-col items-center mb-10" data-purpose="header">
<!-- Logo Placeholder -->
<div class="w-48 mb-4 h-20 flex items-center justify-center bg-white/10 rounded-xl" data-purpose="logo-area">
<span class="text-xl font-bold tracking-tight text-center">Ma Baker <br/> &amp; Chef</span>
</div>
<h1 class="text-2xl font-bold text-white mb-2">Bienvenido de nuevo</h1>
<p class="text-white/70 text-sm">Ingresa tus credenciales para acceder</p>
</header>
<!-- END: HeaderSection -->
<!-- BEGIN: RoleSelectionSection -->
<section class="mb-10" data-purpose="role-selection">
<h2 class="text-xs font-semibold uppercase tracking-wider mb-4 text-white/80">Acceso Rápido por Rol</h2>
<div class="grid grid-cols-2 md:grid-cols-5 gap-3" data-purpose="role-grid">
<!-- Administrador -->
<button class="role-btn flex flex-col items-center justify-center p-3 rounded-xl bg-white/10 border border-white/10" data-purpose="role-admin" type="button" onclick="quickLogin('admin@mabakerandchef.com','Admin2026!')">
<i class="w-6 h-6 mb-1" data-lucide="shield-check"></i>
<span class="text-[10px] font-medium">Administrador</span>
</button>
<!-- RRHH -->
<button class="role-btn flex flex-col items-center justify-center p-3 rounded-xl bg-white/10 border border-white/10" data-purpose="role-rrhh" type="button" onclick="quickLogin('rrhh@mabakerandchef.com','RRHH2026!')">
<i class="w-6 h-6 mb-1" data-lucide="users"></i>
<span class="text-[10px] font-medium text-center">RRHH</span>
</button>
<!-- Médico -->
<button class="role-btn flex flex-col items-center justify-center p-3 rounded-xl bg-white/10 border border-white/10" data-purpose="role-medico" type="button" onclick="quickLogin('medico@mabakerandchef.com','Medico2026!')">
<i class="w-6 h-6 mb-1" data-lucide="stethoscope"></i>
<span class="text-[10px] font-medium text-center">Médico</span>
</button>
<!-- Jefe de Área -->
<button class="role-btn flex flex-col items-center justify-center p-3 rounded-xl bg-white/10 border border-white/10" data-purpose="role-jefe" type="button" onclick="quickLogin('jefe@mabakerandchef.com','Jefe2026!')">
<i class="w-6 h-6 mb-1" data-lucide="briefcase"></i>
<span class="text-[10px] font-medium text-center leading-tight">Jefe de Área</span>
</button>
<!-- Seguridad e Higiene -->
<button class="role-btn flex flex-col items-center justify-center p-3 rounded-xl bg-white/10 border border-white/10 col-span-2 md:col-span-1" data-purpose="role-seguridad" type="button" onclick="quickLogin('sgi@mabakerandchef.com','SGI2026!')">
<i class="w-6 h-6 mb-1" data-lucide="hard-hat"></i>
<span class="text-[10px] font-medium text-center leading-tight">SGI / Seg. Industrial</span>
</button>
</div>
</section>
<!-- END: RoleSelectionSection -->
<!-- BEGIN: FormSection -->
<form id="loginForm" class="space-y-5" data-purpose="login-form" onsubmit="handleLogin(event)" novalidate>
<div class="space-y-2">
<label class="text-sm font-medium text-white/90" for="email">Correo Electrónico</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<i class="w-5 h-5 text-white/50" data-lucide="mail"></i>
</div>
<input class="block w-full pl-10 pr-3 py-4 bg-white/10 border border-white/20 rounded-xl text-white placeholder-white/40 focus:outline-none focus:ring-2 focus:ring-mb-blue focus:border-transparent transition-all sm:text-sm" id="email" name="email" placeholder="nombre@mabakerandchef.com" required="" type="email"/>
</div>
</div>
<div class="space-y-2">
<div class="flex items-center justify-between">
<label class="text-sm font-medium text-white/90" for="password">Contraseña</label>
<a class="text-xs text-white/60 hover:text-white transition-colors" href="#">¿Olvidaste tu contraseña?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<i class="w-5 h-5 text-white/50" data-lucide="lock"></i>
</div>
<input class="block w-full pl-10 pr-3 py-4 bg-white/10 border border-white/20 rounded-xl text-white placeholder-white/40 focus:outline-none focus:ring-2 focus:ring-mb-blue focus:border-transparent transition-all sm:text-sm" id="password" name="password" placeholder="••••••••••••" required="" type="password"/>
</div>
</div>
<div class="pt-4">
<button id="btnLogin" class="w-full flex justify-center py-4 px-4 border border-transparent rounded-xl shadow-lg text-sm font-bold text-white bg-mb-red hover:bg-[#b21e25] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-mb-red transition-all duration-300 transform hover:scale-[1.02]" data-purpose="submit-button" type="submit">
            Ingresar al Sistema
          </button>
</div>
</form>
<!-- END: FormSection -->
<!-- BEGIN: FooterLinks -->
<footer class="mt-10 pt-6 border-t border-white/10 flex justify-center" data-purpose="footer-links">
<a class="flex items-center text-sm text-white/70 hover:text-white transition-colors" href="#">
<i class="w-4 h-4 mr-2" data-lucide="help-circle"></i>
          Soporte Técnico
        </a>
</footer>
<!-- END: FooterLinks -->
</div>
<!-- END: GlassmorphismCard -->
</main>
<!-- END: LoginContainer -->
<script data-purpose="icon-initialization">
    // Initialize Lucide icons
    lucide.createIcons();
  </script>
  <!-- Main Authentication App Logic -->
  <script src="js/auth.js"></script>
    <script>
        /* Verificar sesión activa */
        window.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('mb_token');
            const expira = localStorage.getItem('mb_expira');
            const rol = localStorage.getItem('mb_rol');
            if (token && expira && new Date() < new Date(expira) && rol) {
                const routes = {
                    admin: 'dashboard-admin.html', rrhh: 'dashboard-rrhh.html',
                    medico: 'dashboard-medico.html', jefe: 'dashboard-jefe.html', sgi: 'dashboard-sgi.html',
                    seguridad: 'dashboard-seguridad.html'
                };
                if (routes[rol]) {
                    window.location.href = routes[rol];
                }
            }
        });

        function quickLogin(email, pwd) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = pwd;
            document.getElementById('loginForm').dispatchEvent(new Event('submit', { cancelable: true }));
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            if (!email || !password) { alert('Completa todos los campos.'); return; }
            
            const btn = document.getElementById('btnLogin');
            const originalText = btn.innerHTML;
            btn.innerHTML = 'Verificando...';
            btn.disabled = true;
            
            try {
                const session = await login(email, password);
                const routes = {
                    admin: 'dashboard-admin.html', rrhh: 'dashboard-rrhh.html',
                    medico: 'dashboard-medico.html', jefe: 'dashboard-jefe.html', sgi: 'dashboard-sgi.html',
                    seguridad: 'dashboard-seguridad.html'
                };
                window.location.href = routes[session.rol] || 'login.html';
            } catch (err) {
                btn.innerHTML = originalText;
                btn.disabled = false;
                alert(err.message || 'Error de conexión.');
                document.getElementById('password').value = '';
            }
        }
    </script>
</body></html>

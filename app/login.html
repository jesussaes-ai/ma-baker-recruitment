<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#D7282F">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Ma Baker RH">
    <link rel="apple-touch-icon" href="assets/icon-192x192.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <meta name="description" content="Ma Baker and Chef — Acceso al Sistema de Reclutamiento">
    <title>Ma Baker and Chef | Acceso al Sistema</title>
    <link rel="icon" href="assets/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --mb-red: #D7282F;
            --mb-red-dark: #B01E24;
            --mb-red-light: #E85059;
            --mb-blue: #0071BC;
            --mb-blue-dark: #005A96;
            --mb-dark: #1C1C1C;
            --mb-white: #FFFFFF;
            --mb-gray: #F5F5F5;
            --mb-border: #E5E7EB;
            --font: 'Montserrat', sans-serif;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
            font-family: var(--font);
            -webkit-font-smoothing: antialiased;
        }

        body {
            background: var(--mb-red);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Patrón de fondo */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at 30% 70%, rgba(183, 14, 20, 0.6) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 20%, rgba(0, 0, 0, 0.4) 0%, transparent 50%);
            pointer-events: none;
        }

        /* ── Login Container ── */
        .login-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 20px;
            position: relative;
            z-index: 1;
        }

        .login-card {
            background: var(--mb-white);
            border-radius: 24px;
            padding: 40px 36px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 32px 80px rgba(0, 0, 0, 0.35);
            animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(28px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ── Brand ── */
        .login-brand {
            text-align: center;
            margin-bottom: 28px;
            padding-bottom: 24px;
            border-bottom: 2px solid #F3F4F6;
        }

        .brand-logo-wrapper {
            background: var(--mb-white);
            border-radius: 16px;
            padding: 12px 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
            border: 1.5px solid #F0F0F0;
        }

        .brand-logo-wrapper img {
            height: 60px;
            width: auto;
            max-width: 240px;
            object-fit: contain;
        }

        .system-label {
            font-size: 12px;
            font-weight: 600;
            color: #6B7280;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        /* ── Acceso Rápido por Rol ── */
        .role-selector {
            margin-bottom: 24px;
        }

        .role-selector-label {
            font-size: 11px;
            font-weight: 700;
            color: #9CA3AF;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            text-align: center;
            margin-bottom: 10px;
        }

        .roles-grid-login {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .role-btn-login {
            background: #F9FAFB;
            border: 1.5px solid var(--mb-border);
            border-radius: 10px;
            padding: 10px 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.15s;
            font-family: var(--font);
            font-size: 12px;
            font-weight: 600;
            color: var(--mb-dark);
            text-align: left;
        }

        .role-btn-login:hover {
            border-color: var(--mb-red);
            background: #FFF5F5;
            color: var(--mb-red-dark);
        }

        .role-btn-login.full {
            grid-column: 1 / -1;
        }

        .role-icon-sm {
            font-size: 18px;
        }

        /* ── Divider ── */
        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 18px 0;
            color: #9CA3AF;
            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--mb-border);
        }

        /* ── Form ── */
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--mb-dark);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .field-input {
            width: 100%;
            padding: 13px 14px;
            border: 1.5px solid var(--mb-border);
            border-radius: 10px;
            font-size: 15px;
            background: #FAFAFA;
            color: var(--mb-dark);
            outline: none;
            transition: all 0.2s;
            font-family: var(--font);
            -webkit-appearance: none;
            appearance: none;
        }

        .field-input:focus {
            border-color: var(--mb-red);
            background: var(--mb-white);
            box-shadow: 0 0 0 3px rgba(215, 40, 47, 0.12);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper .field-input {
            padding-right: 48px;
        }

        .toggle-pwd {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 17px;
            color: #9CA3AF;
            padding: 4px;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: var(--mb-red);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            font-family: var(--font);
            transition: all 0.2s;
            box-shadow: 0 4px 14px rgba(215, 40, 47, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-login:hover {
            background: var(--mb-red-dark);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(215, 40, 47, 0.5);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2.5px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ── Error ── */
        .error-msg {
            background: #FEF2F2;
            border: 1px solid #FECACA;
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 13px;
            color: #DC2626;
            display: none;
            align-items: center;
            gap: 8px;
            animation: shake 0.4s ease;
        }

        .error-msg.show {
            display: flex;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            75% {
                transform: translateX(5px);
            }
        }

        /* ── Footer del login ── */
        .login-footer {
            text-align: center;
            padding: 14px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.45);
            position: relative;
            z-index: 1;
            font-family: var(--font);
        }

        @media (min-width: 480px) {
            .login-card {
                padding: 44px 44px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">
        <div class="login-card">

            <!-- Brand -->
            <div class="login-brand">
                <div class="brand-logo-wrapper">
                    <img src="assets/logo.webp" alt="Ma Baker and Chef"
                        onerror="this.style.display='none'; this.parentElement.innerHTML='<span style=\'font-size:36px\'>🧁</span><span style=\'color:white;font-weight:800;font-size:18px;margin-left:8px\'>Ma Baker<br>and Chef</span>'">
                </div>
                <div class="system-label">📋 Sistema de Gestión de Talento</div>
            </div>

            <!-- Error -->
            <div class="error-msg" id="errorMsg">
                <span>⚠️</span>
                <span id="errorText">Credenciales incorrectas.</span>
            </div>


            <!-- Form -->
            <form class="login-form" id="loginForm" onsubmit="handleLogin(event)" novalidate>
                <div class="field-group">
                    <label class="field-label" for="email">Correo electrónico</label>
                    <input type="email" id="email" class="field-input" placeholder="usuario@mabakerandchef.com"
                        autocomplete="email" required>
                </div>
                <div class="field-group">
                    <label class="field-label" for="password">Contraseña</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" class="field-input" placeholder="••••••••••"
                            autocomplete="current-password" required>
                        <button type="button" class="toggle-pwd" onclick="togglePwd()"
                            title="Ver contraseña">👁️</button>
                    </div>
                </div>
                <button type="submit" class="btn-login" id="btnLogin">
                    <div class="spinner" id="spinner"></div>
                    <span id="btnText">Ingresar al sistema</span>
                </button>
            </form>
        </div>
    </div>

    <footer class="login-footer">© 2026 Ma Baker and Chef S.A. de C.V. — Acceso Restringido | Uso Exclusivamente Interno
    </footer>

    <script src="js/auth.js"></script>
    <script>
        /* Verificar sesión activa */
        window.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('mb_token');
            const expira = localStorage.getItem('mb_expira');
            const rol = localStorage.getItem('mb_rol');
            if (token && expira && new Date() < new Date(expira) && rol) {
                const routes = {
                    admin: 'dashboard-admin.html', rrhh: 'dashboard-rrhh.html',
                    medico: 'dashboard-medico.html', jefe: 'dashboard-jefe.html', sgi: 'dashboard-sgi.html'
                };
                window.location.href = routes[rol] || 'login.html';
            }
        });

        function togglePwd() {
            const i = document.getElementById('password');
            i.type = i.type === 'password' ? 'text' : 'password';
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            if (!email || !password) { showError('Completa todos los campos.'); return; }
            setLoading(true); hideError();
            try {
                const session = await login(email, password);
                const routes = {
                    admin: 'dashboard-admin.html', rrhh: 'dashboard-rrhh.html',
                    medico: 'dashboard-medico.html', jefe: 'dashboard-jefe.html', sgi: 'dashboard-sgi.html'
                };
                window.location.href = routes[session.rol] || 'login.html';
            } catch (err) {
                setLoading(false);
                showError(err.message || 'Error de conexión.');
                document.getElementById('password').value = '';
            }
        }

        function setLoading(v) {
            document.getElementById('spinner').style.display = v ? 'block' : 'none';
            document.getElementById('btnText').textContent = v ? 'Verificando...' : 'Ingresar al sistema';
            document.getElementById('btnLogin').disabled = v;
        }
        function showError(m) { document.getElementById('errorText').textContent = m; document.getElementById('errorMsg').classList.add('show'); }
        function hideError() { document.getElementById('errorMsg').classList.remove('show'); }
    </script>
    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("sw.js").catch(() => {});
        }
    </script>
</body>

</html>

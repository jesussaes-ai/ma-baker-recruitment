<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modulo Independiente de Postulacion</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }
    .topbar {
      padding: 10px 14px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.2);
      background: rgba(2, 6, 23, 0.9);
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 700;
    }
    iframe {
      width: 100%;
      height: calc(100vh - 42px);
      border: 0;
      background: #020617;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <button type="button" onclick="window.location.href='index.html'" style="margin-right:10px;padding:4px 10px;border-radius:999px;border:1px solid rgba(148,163,184,.35);background:rgba(15,23,42,.6);color:#e2e8f0;cursor:pointer;font:inherit;">← Inicio</button>
    Modulo independiente de postulacion de candidatos
  </div>
  <iframe
    id="postulacionFrame"
    title="Modulo de postulacion"
    referrerpolicy="strict-origin-when-cross-origin"
    src="index.html?standalone=1&embed=1">
  </iframe>

  <script>
    window.addEventListener("message", (event) => {
      const data = event && event.data ? event.data : null;
      if (!data || data.channel !== "mb-postulacion") return;
      window.dispatchEvent(new CustomEvent("mb:postulacion:bridge", { detail: data }));
    });
  </script>
</body>
</html>
